<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị - Kicks Sneaker</title>
    <link rel="stylesheet" href="../css/admin.css?v=20261030-layout-3">
    <link rel="stylesheet" href="../css/admin-layout.css?v=20261101-final">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-login-body">
    <div id="toast" role="status" aria-live="polite">Thông báo</div>

    <main class="admin-login-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <a href="index.html" class="sidebar-header" style="font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: var(--primary); text-decoration: none; display: inline-block;">
                KICKS <span style="color: var(--accent);">ADMIN.</span>
            </a>
            <div style="margin-top: 8px;">
                <span class="badge-role"><i class="fas fa-shield-halved"></i> Cổng Xác Thực Quản Trị</span>
            </div>
            <h1 style="font-size: 22px; font-weight: 800; color: var(--dark); margin: 16px 0 6px;">Đăng Nhập Quản Trị Viên</h1>
            <p style="font-size: 13px; color: #64748b; line-height: 1.6;">Hệ thống kiểm soát kho hàng, đơn đặt và dữ liệu khách hàng Kicks Sneaker.</p>
        </div>

        <form action="index.html" method="get" novalidate>
            <div class="form-group" style="margin-bottom: 16px;">
                <label style="font-size: 13px; font-weight: 700; color: var(--dark); display: block; margin-bottom: 6px;">
                    <i class="fas fa-user-shield" style="color: var(--accent); margin-right: 4px;"></i> Tài khoản hoặc Email quản trị
                </label>
                <input class="admin-input" type="text" placeholder="Nhập tài khoản quản trị (vd: admin)" value="admin">
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label style="font-size: 13px; font-weight: 700; color: var(--dark); display: block; margin-bottom: 6px;">
                    <i class="fas fa-lock" style="color: var(--accent); margin-right: 4px;"></i> Mật khẩu
                </label>
                <input class="admin-input" type="password" placeholder="Nhập mật khẩu" value="123456">
            </div>

            <button type="submit" class="btn-solid-primary" style="width: 100%; justify-content: center; padding: 13px; font-size: 15px; border-radius: 10px;">
                <i class="fas fa-right-to-bracket"></i> Đăng nhập hệ thống
            </button>
        </form>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
