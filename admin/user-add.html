<h1 class="page-title">Thêm người dùng</h1>
</div>
</div>
<form class="admin-card" onsubmit="event.preventDefault(); showToast('Đã thêm người dùng thành công!');">
<div class="form-grid-2">
<div class="form-group">
<label>Họ và tên<input class="admin-input" type="text" placeholder="Nhập họ và tên">
</label>
</div>
<div class="form-group">
<label>Email<input class="admin-input" type="email" placeholder="Nhập email">
</label>
</div>
<div class="form-group">
<label>Số điện thoại<input class="admin-input" type="tel" placeholder="Nhập số điện thoại">
</label>
</div>
<div class="form-group">
<label>Trạng thái tài khoản<select class="admin-select">
<option>Đang hoạt động</option>
<option>Đang khóa</option>
</select>
</label>
</div>
</div>
<div class="form-group">
<label>Địa chỉ<input class="admin-input" type="text" placeholder="Nhập địa chỉ nhận hàng">
</label>
</div>
<div class="form-group">
<label>Mật khẩu<input class="admin-input" type="password" placeholder="Nhập mật khẩu tài khoản">
</label>
</div>
<div class="table-actions">
<button type="submit" class="btn-solid-primary">Lưu người dùng</button>
<a class="btn-outline-danger" href="users.html">Quay lại</a>
