<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Kicks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/static-pages.css">
</head>
<body class="login-body">
    <div id="toast">Thông báo</div>

    <header class="navbar">
        <div class="logo"><a href="index.html">KICKS.</a></div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Trang chủ</a></li>
            <li><a href="products.html"><i class="fas fa-shoe-prints"></i> Sản phẩm</a></li>
        </ul>
        <div class="search-bar">
            <form action="register.html" method="get">
                <input type="text" placeholder="Tìm kiếm sneaker...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
        <div class="auth-buttons">
            <a href="cart.html" class="icon-link"><i class="fas fa-shopping-cart"></i> Giỏ hàng</a>
            <a href="login.html" class="icon-link active" title="Đăng nhập"><i class="fas fa-user-circle"></i> Tài khoản</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="login-container">
                <h2>Tạo tài khoản mới</h2>
                <form onsubmit="event.preventDefault(); showToast('Đăng ký thành công!');">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" placeholder="Nhập họ tên của bạn">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" placeholder="Nhập email">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" placeholder="Nhập mật khẩu">
                    </div>
                    <button type="submit" class="btn-submit">Tạo tài khoản</button>
                </form>
                <div class="auth-links">
                    <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
                </div>
            </div>
            <div class="auth-image" style="background-image: url('images/shoe5.jpg');"></div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
