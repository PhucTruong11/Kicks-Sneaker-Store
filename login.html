<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Kicks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=20261030-layout-3">
    <link rel="stylesheet" href="css/store-layout.css?v=20261030-4">
</head>
<body class="login-body">
    <div id="toast">Thông báo</div>

    <header class="navbar">
        <div class="logo"><a href="index.html">KICKS.</a></div>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Trang chủ</a></li>
            <li><a href="products.html"><i class="fas fa-shoe-prints"></i> Sản phẩm</a></li>
        </ul>
        <div class="search-bar">
            <form action="login.html" method="get">
                <input type="text" placeholder="Tìm kiếm sneaker...">
                <button type="submit"><i class="fas fa-search"></i></button>
            </form>
        </div>
        <div class="auth-buttons">
            <a href="cart.html" class="icon-link"><i class="fas fa-shopping-cart"></i> Giỏ hàng</a>
            <a href="login.html" class="icon-link active" title="Đăng nhập"><i class="fas fa-user-circle"></i> Tài khoản</a>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="auth-card">
            <div class="auth-image"></div>
            <div class="login-container">
                <h2>Xin chào trở lại!</h2>
                <form action="index.html" method="get" novalidate>
                    <div class="form-group">
                        <label>Email hoặc Tên đăng nhập</label>
                        <input type="text" placeholder="Nhập email hoặc tên đăng nhập">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" placeholder="Nhập mật khẩu">
                    </div>
                    <button type="submit" class="btn-submit">Đăng nhập ngay</button>
                </form>
                <div class="auth-links">
                    <p>Chưa có tài khoản? <a href="register.html">Đăng ký tại đây</a></p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
